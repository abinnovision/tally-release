name: Release dry run

on:
  push:
    branches:
      - main

# One group per commit, so a release merge is never cancelled by later pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

permissions: {}

jobs:
  dry-run:
    name: Release dry run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build
      # Evidence only: shows the release PR and tags tallyrelease would create.
      - name: tallyrelease run --dry-run
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node packages/cli/dist/bin.js run --dry-run --summary

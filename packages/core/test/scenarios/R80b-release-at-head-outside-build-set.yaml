description: >-
  A release at HEAD of a unit outside the build set is a catch-up and warns
  W_RELEASE_NOT_BUILT.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
      - { id: b, root: packages/b }
config:
  plugins: { stub: {} }
  defaults: { release: true }
  branches:
    - { name: main, line: default }
git:
  commits:
    - id: c0
      files: { packages/a/index.ts: "0", packages/b/index.ts: "0" }
    - id: c1
      message: "fix: b"
      files: { packages/b/index.ts: "1" }
  tags:
    - { name: a-v1.0.0, commit: c0 }
    - { name: a-v1.1.0, commit: c1 }
base: c0
plan: { released: true }
expect:
  affected:
    units:
      - { id: b, reason: direct }
  plan:
    released:
      - { id: a, tag: a-v1.1.0, releaseSha: c1, catchUp: true }
    warnings:
      - code: W_RELEASE_NOT_BUILT
        message: release a-v1.1.0 is at HEAD but unit a is not in the build set; it is listed as a catch-up
        unit: a

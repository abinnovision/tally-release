description: >-
  An ungrouped released unit whose id equals a group name cannot name a release
  item.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
      - { id: b, root: packages/b }
      - { id: sdk, root: packages/sdk }
config:
  plugins: { stub: {} }
  defaults: { release: true }
  groups:
    sdk: { units: [a, b] }
git:
  commits:
    - id: c0
      files:
        { packages/a/i.ts: "0", packages/b/i.ts: "0", packages/sdk/i.ts: "0" }
base: c0
plan: { fails: true }
expect:
  planError:
    code: E_RELEASE_ITEM_NAME
    details: { item: sdk }

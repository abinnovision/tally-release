description: >-
  In a group the computed bump wins over a lower Release-As (max rule); a
  value not above the group's from version is ignored.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
      - { id: b, root: packages/b }
config:
  plugins: { stub: {} }
  defaults: { release: true }
  groups:
    sdk: { units: [a, b] }
  branches:
    - { name: main, line: default }
git:
  commits:
    - id: c0
      files: { packages/a/index.ts: "0", packages/b/index.ts: "0" }
    - id: c1
      message: "feat: a\n\nRelease-As: a@1.4.1"
      files: { packages/a/index.ts: "1" }
    - id: c2
      message: "fix: b\n\nRelease-As: b@1.4.0"
      files: { packages/b/index.ts: "2" }
  tags:
    - { name: a-v1.4.0, commit: c0 }
    - { name: b-v1.2.0, commit: c0 }
base: c0
plan: {}
expect:
  plan:
    units:
      - { id: a, from: 1.4.0, releaseAs: 1.4.1, next: 1.5.0 }
      - { id: b, from: 1.2.0, releaseAs: null, next: 1.5.0 }
    groups: [{ name: sdk, from: 1.4.0, bump: minor, next: 1.5.0 }]
    warnings:
      - code: W_RELEASE_AS_INVALID
        message: 'unit "b": Release-As "1.4.0" in c2 does not exceed 1.4.0 (group sdk); ignored'
        unit: b

description: >-
  A unit pending only through Release-As propagates to its pinned dependent.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
      - { id: b, root: packages/b }
    edges:
      - { from: a, to: b, reason: dependencies, pinned: true }
config:
  plugins: { stub: {} }
  defaults: { release: true }
  branches:
    - { name: main, line: default }
git:
  commits:
    - id: c0
      files: { packages/a/index.ts: "0", packages/b/index.ts: "0" }
    - id: c1
      message: "chore: a\n\nRelease-As: 2.0.0"
      files: { packages/a/index.ts: "1" }
  tags:
    - { name: a-v1.0.0, commit: c0 }
    - { name: b-v1.0.0, commit: c0 }
base: c0
plan: {}
expect:
  plan:
    units:
      - { id: a, bump: null, releaseAs: 2.0.0, next: 2.0.0 }
      - { id: b, bump: patch, next: 1.0.1, propagatedFrom: [a] }
    warnings: []

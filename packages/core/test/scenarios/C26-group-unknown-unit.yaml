description: A group naming an unknown unit fails.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
config:
  plugins: { stub: {} }
  groups:
    sdk: { units: [a, nope] }
git:
  commits:
    - id: c0
      files: { packages/a/index.ts: "0" }
base: null
error:
  code: E_GROUP_UNKNOWN_UNIT
  details: { group: sdk, unit: nope }

description: >-
  A released unit named shared is rejected: the item name is reserved for the
  shared release PR.
plugins:
  - name: stub
    units:
      - { id: "shared", root: packages/x }
config:
  plugins: { stub: {} }
  defaults: { release: true }
git:
  commits:
    - id: c0
      files: { packages/x/i.ts: "0" }
base: c0
plan: { fails: true }
expect:
  planError:
    code: E_RELEASE_ITEM_NAME
    details: { item: "shared" }

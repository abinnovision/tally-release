description: Duplicate edges merge with pinned OR and unioned reasons and sources.
config:
  plugins: { stub: {} }
  deps:
    - { from: a, to: b, pinned: true }
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
      - { id: b, root: packages/b }
    edges:
      - { from: a, to: b, reason: devDependencies, pinned: false }
      - { from: a, to: b, reason: dependencies, pinned: false }
git:
  commits:
    - id: c0
      files: { packages/a/index.ts: "1", packages/b/index.ts: "1" }
base: null
expect:
  edges:
    - from: a
      to: b
      pinned: true
      reasons: [config, dependencies, devDependencies]
      sources: [config, stub]

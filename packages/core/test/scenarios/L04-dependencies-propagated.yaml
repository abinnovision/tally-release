description: >-
  A unit released only through propagation gets a section with only
  Dependencies, field and package name taken from the edge reason.
plugins:
  - name: stub
    units:
      - { id: cli, root: packages/cli }
      - { id: core, root: packages/core }
    edges:
      - { from: core, to: cli, reason: "dependencies: @s/core", pinned: false }
config:
  plugins: { stub: {} }
  defaults: { release: true, propagate: patch }
  branches:
    - { name: main, line: default }
git:
  commits:
    - id: c0
      files: { packages/cli/i.ts: "0", packages/core/i.ts: "0" }
    - id: c1
      message: "feat(core): one (#7)"
      files: { packages/core/i.ts: "1" }
  tags:
    - { name: cli-v1.0.0, commit: c0 }
    - { name: core-v1.0.0, commit: c0 }
base: c0
plan: { all: true }
release:
  changelog: { date: "2026-10-15", repoUrl: "https://github.com/o/r" }
expect:
  changelogs:
    core: |-
      ## [1.1.0](https://github.com/o/r/compare/core-v1.0.0...core-v1.1.0) (2026-10-15)


      ### Features

      * **core:** one ([#7](https://github.com/o/r/issues/7)) ([c1](https://github.com/o/r/commit/c1))
    cli: |-
      ## [1.0.1](https://github.com/o/r/compare/cli-v1.0.0...cli-v1.0.1) (2026-10-15)


      ### Dependencies

      * The following workspace dependencies were updated
        * dependencies
          * @s/core bumped to 1.1.0

description: >-
  An unpinned edge into a unit with propagate patch between items in different
  release PRs is rejected too.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
      - { id: b, root: packages/b }
    edges:
      - { from: a, to: b, reason: "dependencies: a", pinned: false }
config:
  plugins: { stub: {} }
  defaults: { release: true, releasePr: separate }
  units:
    packages/b: { propagate: patch }
git:
  commits:
    - id: c0
      files: { packages/a/i.ts: "0", packages/b/i.ts: "0" }
    - id: c1
      message: "fix: a"
      files: { packages/a/i.ts: "1" }
base: c0
plan: { fails: true }
expect:
  planError:
    code: E_RELEASE_PR_SPLIT_EDGE
    details: { from: a, to: b, items: [a, b] }

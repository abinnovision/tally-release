description: The base tag skips prerelease tags and tags not merged into head.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
config:
  plugins: { stub: {} }
  defaults: { release: true }
git:
  commits:
    - id: c0
      files: { packages/a/index.ts: "0" }
    - id: c1
      message: "fix: a"
      files: { packages/a/index.ts: "1" }
    - id: c2
      parents: [c1]
      message: "feat!: next major"
      files: { packages/a/index.ts: "2" }
    - id: c3
      parents: [c1]
      message: "feat: a"
      files: { packages/a/index.ts: "3" }
  tags:
    - { name: a-v1.0.0, commit: c0 }
    - { name: a-v1.1.0-beta.1, commit: c1 }
    - { name: a-v2.0.0, commit: c2, annotated: true }
    - { name: b-v9.0.0, commit: c3 }
base: c0
plan: {}
expect:
  facts:
    head: c3
    units:
      - id: a
        tags:
          - { name: a-v1.0.0, sha: c0, version: 1.0.0 }
          - { name: a-v1.1.0-beta.1, sha: c1, version: 1.1.0-beta.1 }
          - { name: a-v2.0.0, sha: c2, version: 2.0.0 }
        baseTag: { name: a-v1.0.0 }
        lineBaseTag: { name: a-v1.0.0 }
        sinceLineBase: 2
        total: 3
        changes:
          - { change: { sha: c3, type: feat }, units: [a] }
          - { change: { sha: c1, type: fix }, units: [a] }
        releaseAs: []

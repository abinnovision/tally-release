description: >-
  A maintenance tag reached only through a merge-back is not released on
  main; a tag on main's first-parent chain is.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
config:
  plugins: { stub: {} }
  defaults: { release: true }
  branches:
    - { name: main, line: default }
    - { name: "release/{major}.x", line: maintenance }
git:
  commits:
    - id: c0
      files: { packages/a/index.ts: "0" }
    - id: c1
      message: "feat!: a rewrite"
      files: { packages/a/index.ts: "1" }
    - id: c2
      parents: [c0]
      message: "fix: a hotfix"
      files: { packages/a/fix.ts: "2" }
    - id: m
      parents: [c1, c2]
      message: "Merge branch 'release/1.x'"
    - id: c3
      message: "chore(release): a@2.0.0"
      files: { packages/a/CHANGELOG.md: "2.0.0" }
  tags:
    - { name: a-v1.4.2, commit: c0 }
    - { name: a-v1.4.3, commit: c2 }
    - { name: a-v2.0.0, commit: c3 }
base: c0
plan: { released: true }
expect:
  plan:
    released:
      - { id: a, tag: a-v2.0.0, releaseSha: c3 }
    warnings: []

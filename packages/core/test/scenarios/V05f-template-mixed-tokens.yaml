description: >-
  Version file templates: {version} mixed with {major} is a config error, since
  the two values could disagree.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
config:
  plugins: { stub: {} }
  defaults: { release: true }
  units:
    packages/a:
      versionFiles: [{ file: README.md, pattern: "a@{version} (v{major})" }]
git:
  commits:
    - id: c0
      files: { packages/a/i.ts: "0", README.md: "a\n" }
base: null
plan: { fails: true }
expect:
  planError:
    code: E_CONFIG
    details: { unit: a, pattern: "a@{version} (v{major})" }

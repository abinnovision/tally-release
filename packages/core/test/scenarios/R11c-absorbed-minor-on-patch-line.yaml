description: >-
  With bumps.absorbed minor, an absorbed feat exceeds the patch limit and
  is listed with its level and via.
branch: release/1.4.x
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
      - { id: db, root: packages/db }
config:
  plugins: { stub: {} }
  units:
    packages/a: { release: true }
  deps:
    - { from: db, to: a }
  bumps: { absorbed: minor }
  branches:
    - { name: "release/{major}.{minor}.x", line: maintenance }
git:
  commits:
    - id: c0
      files: { packages/a/index.ts: "0", packages/db/index.ts: "0" }
    - id: c1
      message: "feat: db query"
      files: { packages/db/index.ts: "1" }
  tags:
    - { name: a-v1.4.2, commit: c0 }
base: c0
plan: {}
error:
  code: E_CAP
  details:
    unit: a
    limit: patch
    next: 1.5.0
    commits: [{ sha: c1, subject: db query, level: minor, via: db }]

description: globalInputs is stripped before options validation.
config:
  plugins:
    stub: { mode: fast, globalInputs: false }
plugins:
  - name: stub
    optionKeys: [mode]
    units:
      - { id: a, root: packages/a }
    inputs: [yarn.lock]
git:
  commits:
    - id: c0
      files: { packages/a/index.ts: "1", yarn.lock: "1" }
    - id: c1
      files: { yarn.lock: "2" }
base: c0
expect:
  affected:
    build: { all: false, globalInputs: [] }
    units: []
    unattributed: [yarn.lock]

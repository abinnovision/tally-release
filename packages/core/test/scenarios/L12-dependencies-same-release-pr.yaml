description: >-
  Dependencies list only units released in the same release PR: with separate
  items, b's section has no line for a.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
      - { id: b, root: packages/b }
    edges:
      - { from: a, to: b, reason: "dependencies: @s/a", pinned: false }
config:
  plugins: { stub: {} }
  defaults: { release: true, releasePr: separate }
  branches:
    - { name: main, line: default }
git:
  commits:
    - id: c0
      files: { packages/a/i.ts: "0", packages/b/i.ts: "0" }
    - id: c1
      message: "fix: a and b"
      files: { packages/a/i.ts: "1", packages/b/i.ts: "1" }
  tags:
    - { name: a-v1.0.0, commit: c0 }
    - { name: b-v1.0.0, commit: c0 }
base: c0
plan: { all: true }
release:
  changelog: { date: "2026-10-15" }
expect:
  changelogs:
    a: |-
      ## 1.0.1 (2026-10-15)


      ### Bug Fixes

      * a and b
    b: |-
      ## 1.0.1 (2026-10-15)


      ### Bug Fixes

      * a and b

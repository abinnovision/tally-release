description: >-
  A rule with unit checks that unit's from against the captured major:
  web at 2.1.0 on release/1.x is E_CAP_BASE.
branch: release/1.x
plugins:
  - name: stub
    units:
      - { id: web, root: apps/web }
      - { id: api, root: apps/api }
config:
  plugins: { stub: {} }
  defaults: { release: true }
  branches:
    - { name: "release/{major}.x", line: maintenance, unit: web }
git:
  commits:
    - id: c0
      files: { apps/web/index.ts: "0", apps/api/index.ts: "0" }
    - id: c1
      message: "fix: web"
      files: { apps/web/index.ts: "1" }
  tags:
    - { name: web-v2.1.0, commit: c0 }
    - { name: api-v1.0.0, commit: c0 }
base: c0
plan: {}
error:
  code: E_CAP_BASE
  details: { unit: web, rule: "release/{major}.x", major: 1, from: 2.1.0 }

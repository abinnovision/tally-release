description: >-
  Two units template one README.md (one as ./README.md); each replaces only
  its own rendering.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
      - { id: b, root: packages/b }
config:
  plugins: { stub: {} }
  defaults: { release: true }
  units:
    packages/a:
      versionFiles: [{ file: README.md, pattern: "{id}-v{major}" }]
    packages/b:
      versionFiles: [{ file: ./README.md, pattern: "{id}-v{major}" }]
  branches:
    - { name: main, line: default }
git:
  commits:
    - id: c0
      files:
        packages/a/i.ts: "0"
        packages/b/i.ts: "0"
        README.md: "a-v1 b-v2\n"
    - id: c1
      message: "feat!: both"
      files: { packages/a/i.ts: "1", packages/b/i.ts: "1" }
  tags:
    - { name: a-v1.0.0, commit: c0 }
    - { name: b-v2.0.0, commit: c0 }
base: c0
plan: { all: true }
release:
  files: { date: "2026-10-15" }
expect:
  paths: [README.md, packages/a/CHANGELOG.md, packages/b/CHANGELOG.md]
  files:
    README.md: "a-v2 b-v3\n"
  fileWarnings: []

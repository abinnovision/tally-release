description: >-
  A template on a path that is a plugin version file, also when written as
  ./path, is E_VERSION_FILE_CLAIM when release files are built.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a, version: file }
      - { id: b, root: packages/b }
    versionFiles:
      a: [packages/a/VERSION]
config:
  plugins: { stub: {} }
  defaults: { release: true }
  units:
    packages/b:
      versionFiles: [{ file: ./packages/a/VERSION, pattern: "b@{version}" }]
  branches:
    - { name: main, line: default }
git:
  commits:
    - id: c0
      files: { packages/a/VERSION: "1.0.0\n", packages/b/i.ts: "0" }
base: null
plan: { all: true }
release:
  files: { date: "2026-10-15" }
error:
  code: E_VERSION_FILE_CLAIM
  details: { path: packages/a/VERSION, units: [a, b] }

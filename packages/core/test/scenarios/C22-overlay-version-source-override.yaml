description: An overlay version overrides the plugin source of a released unit.
config:
  plugins: { stub: {} }
  units:
    packages/a: { release: true, version: tag }
    packages/b: { version: tag }
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a, version: file }
      - { id: b, root: packages/b, version: file }
git:
  commits:
    - id: c0
      files: { packages/a/index.ts: "1", packages/b/index.ts: "1" }
base: c0
expect:
  units:
    - { id: a, version: tag }
    - { id: b, version: none }

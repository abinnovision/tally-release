description: >-
  Propagation over a pinned three-node cycle reaches a fixpoint: members patch
  each other and the dependent of the cycle is patched once.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
      - { id: b, root: packages/b }
      - { id: c, root: packages/c }
      - { id: d, root: packages/d }
    edges:
      - { from: a, to: b, reason: dependencies, pinned: true }
      - { from: b, to: c, reason: dependencies, pinned: true }
      - { from: c, to: a, reason: dependencies, pinned: true }
      - { from: c, to: d, reason: dependencies, pinned: true }
config:
  plugins: { stub: {} }
  defaults: { release: true }
  branches:
    - { name: main, line: default }
git:
  commits:
    - id: c0
      files:
        packages/a/index.ts: "0"
        packages/b/index.ts: "0"
        packages/c/index.ts: "0"
        packages/d/index.ts: "0"
    - id: c1
      message: "feat: a"
      files: { packages/a/index.ts: "1" }
  tags:
    - { name: a-v1.0.0, commit: c0 }
    - { name: b-v1.0.0, commit: c0 }
    - { name: c-v1.0.0, commit: c0 }
    - { name: d-v1.0.0, commit: c0 }
base: c0
plan: {}
expect:
  plan:
    units:
      - { id: a, bump: minor, next: 1.1.0, propagatedFrom: [c] }
      - { id: b, bump: patch, next: 1.0.1, propagatedFrom: [a] }
      - { id: c, bump: patch, next: 1.0.1, propagatedFrom: [b] }
      - { id: d, bump: patch, next: 1.0.1, propagatedFrom: [c] }
    warnings:
      - { code: W_CYCLE }

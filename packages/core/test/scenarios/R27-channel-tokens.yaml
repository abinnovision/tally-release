description: A channel renders the major captured by its maintenance rule.
branch: release/1.x
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
config:
  plugins: { stub: {} }
  defaults: { release: true }
  branches:
    - { name: main, line: default, channel: beta }
    - { name: "release/{major}.x", line: maintenance, channel: "rc-{major}" }
git:
  commits:
    - id: c0
      files: { packages/a/index.ts: "0" }
    - id: c1
      message: "fix: a"
      files: { packages/a/index.ts: "1" }
  tags:
    - { name: a-v1.2.0, commit: c0 }
base: c0
plan: {}
expect:
  plan:
    line:
      rule: "release/{major}.x"
      kind: maintenance
      channel: rc-1
      maxBump: minor
      absolute: null
    units:
      - { id: a, kind: prerelease, next: 1.2.1, version: 1.2.1-rc-1.1 }
    warnings: []

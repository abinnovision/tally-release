description: >-
  Without a build base only tags at HEAD are released; earlier releases on
  the chain are left out with W_RELEASED_NO_BASE.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
config:
  plugins: { stub: {} }
  defaults: { release: true }
  branches:
    - { name: main, line: default }
git:
  commits:
    - id: c0
      files: { packages/a/index.ts: "0" }
    - id: c1
      message: "feat: a"
      files: { packages/a/index.ts: "1" }
    - id: c2
      message: "chore(release): a@1.1.0"
      files: { packages/a/CHANGELOG.md: "1.1.0" }
  tags:
    - { name: a-v1.0.0, commit: c0 }
    - { name: a-v1.1.0, commit: c2 }
base: null
plan: { released: true }
expect:
  plan:
    released:
      - { id: a, tag: a-v1.1.0, releaseSha: c2, catchUp: false }
    warnings:
      - code: W_RELEASED_NO_BASE
        message: the build base is unknown; released leaves out earlier releases on the first-parent chain

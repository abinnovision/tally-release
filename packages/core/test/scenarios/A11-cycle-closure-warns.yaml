description: Cycles are allowed, closure terminates and a warning names the path.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
      - { id: b, root: packages/b }
      - { id: c, root: packages/c }
    edges:
      - { from: a, to: b, reason: dependencies, pinned: false }
      - { from: b, to: a, reason: devDependencies, pinned: false }
      - { from: b, to: c, reason: dependencies, pinned: false }
git:
  commits:
    - id: c0
      files:
        packages/a/index.ts: "1"
        packages/b/index.ts: "1"
        packages/c/index.ts: "1"
    - id: c1
      files: { packages/a/index.ts: "2" }
base: c0
expect:
  order: [a, b, c]
  affected:
    units:
      - { id: a, reason: direct, via: [] }
      - { id: b, reason: dependent, via: [a] }
      - { id: c, reason: dependent, via: [b] }
    warnings:
      - { code: W_CYCLE, message: "dependency cycle: a -> b -> a" }

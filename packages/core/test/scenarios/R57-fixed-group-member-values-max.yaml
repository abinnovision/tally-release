description: >-
  Release-As values on different members combine by max without a warning.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
      - { id: b, root: packages/b }
config:
  plugins: { stub: {} }
  defaults: { release: true }
  groups:
    sdk: { units: [a, b] }
  branches:
    - { name: main, line: default }
git:
  commits:
    - id: c0
      files: { packages/a/index.ts: "0", packages/b/index.ts: "0" }
    - id: c1
      message: "fix: a\n\nRelease-As: a@2.0.0"
      files: { packages/a/index.ts: "1" }
    - id: c2
      message: "fix: b\n\nRelease-As: b@2.1.0"
      files: { packages/b/index.ts: "2" }
  tags:
    - { name: a-v1.4.0, commit: c0 }
    - { name: b-v1.4.0, commit: c0 }
base: c0
plan: {}
expect:
  plan:
    units:
      - { id: a, releaseAs: 2.0.0, next: 2.1.0 }
      - { id: b, releaseAs: 2.1.0, next: 2.1.0 }
    groups: [{ name: sdk, next: 2.1.0 }]
    warnings: []

description: >-
  A member whose own tag descends from the group base tag reads its range from
  its own tag, so changes it already released do not release the group again.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
      - { id: x, root: packages/x }
config:
  plugins: { stub: {} }
  defaults: { release: true }
  groups:
    sdk: { units: [a, x] }
  branches:
    - { name: main, line: default }
git:
  commits:
    - id: c0
      files: { packages/a/index.ts: "0", packages/x/index.ts: "0" }
    - id: c1
      message: "feat: x"
      files: { packages/x/index.ts: "1" }
  tags:
    - { name: a-v1.4.0, commit: c0 }
    - { name: x-v0.3.0, commit: c1 }
base: c0
plan: { all: true }
expect:
  facts:
    groups: [{ name: sdk, baseTag: { name: a-v1.4.0 } }]
    units:
      - { id: a, from: c0, changes: [] }
      - { id: x, from: c1, changes: [] }
  plan:
    units:
      - { id: a, next: null }
      - { id: x, next: null }
    groups: [{ name: sdk, bump: null, next: null }]
    warnings: []

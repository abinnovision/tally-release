description: >-
  A Release-As without any bump releases every member at that version; all
  bumps stay null.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
      - { id: b, root: packages/b }
config:
  plugins: { stub: {} }
  defaults: { release: true }
  groups:
    sdk: { units: [a, b] }
  branches:
    - { name: main, line: default }
git:
  commits:
    - id: c0
      files: { packages/a/index.ts: "0", packages/b/index.ts: "0" }
    - id: c1
      message: "chore: a\n\nRelease-As: a@2.0.0"
      files: { packages/a/index.ts: "1" }
  tags:
    - { name: a-v1.4.0, commit: c0 }
    - { name: b-v1.4.0, commit: c0 }
base: c0
plan: {}
expect:
  plan:
    units:
      - { id: a, bump: null, releaseAs: 2.0.0, next: 2.0.0 }
      - { id: b, bump: null, releaseAs: null, next: 2.0.0 }
    groups: [{ name: sdk, bump: null, next: 2.0.0 }]
    warnings: []

description: An edge naming an unknown unit fails.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
    edges:
      - { from: a, to: ghost, reason: dependencies, pinned: false }
git:
  commits:
    - id: c0
      files: { packages/a/index.ts: "1" }
base: null
error:
  code: E_EDGE_UNKNOWN_UNIT
  details: { from: a, to: ghost, source: stub, unit: ghost }

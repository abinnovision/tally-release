description: defaults.release opts every unit in; an overlay opts one out.
config:
  plugins: { stub: {} }
  defaults: { release: true }
  units:
    packages/b: { release: false }
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a, version: file }
      - { id: b, root: packages/b, version: file }
git:
  commits:
    - id: c0
      files: { packages/a/index.ts: "1", packages/b/index.ts: "1" }
base: c0
expect:
  units:
    - { id: a, version: file }
    - { id: b, version: none }

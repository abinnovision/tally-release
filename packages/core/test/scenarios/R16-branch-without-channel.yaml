description: A rule without a channel computes next but gives no version.
plugins:
  - name: stub
    units:
      - { id: a, root: packages/a }
config:
  plugins: { stub: {} }
  defaults: { release: true }
  branches:
    - { name: main, line: default }
git:
  commits:
    - id: c0
      files: { packages/a/index.ts: "0" }
    - id: c1
      message: "fix: a"
      files: { packages/a/index.ts: "1" }
  tags:
    - { name: a-v1.0.0, commit: c0 }
base: c0
plan: {}
expect:
  plan:
    line:
      {
        rule: main,
        kind: default,
        channel: null,
        maxBump: null,
        absolute: null,
      }
    units:
      - { id: a, kind: rebuild, next: 1.0.1, version: null }
    warnings: []
